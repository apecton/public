# GitHub Secret Scanning Configuration
# This file tells GitHub to ignore specific patterns that are test fixtures
# in the code_scanner tests.

version: 1
rules:
  # Ignore Stripe test keys in test files
  - id: ignore-stripe-test-keys
    description: "Ignore fake Stripe test keys in test fixtures"
    pattern: 'sk_test_FAKE_TEST_KEY_DOES_NOT_EXIST_[0-9]+'
    paths:
      - code_scanner/tests/test_file_scanner.py
      - code_scanner/tests/test_rules_secrets.py

  # Ignore Stripe keys with 24+ alnum (our local scanner pattern for test fixtures)
  - id: ignore-stripe-test-keys-24
    description: "Ignore fake Stripe keys with 24+ alnum chars in test fixtures"
    pattern: 'sk_test_[0-9a-zA-Z]{24,}'
    paths:
      - code_scanner/tests/test_file_scanner.py
      - code_scanner/tests/test_rules_secrets.py

  # Ignore fake API keys with api_key/secret_key variable names
  - id: ignore-fake-api-keys
    description: "Ignore fake API keys in test fixtures"
    pattern: 'sk_fake_test_key_[a-zA-Z0-9_]+'
    paths:
      - code_scanner/tests/test_file_scanner.py
      - code_scanner/tests/test_rules_secrets.py

  # Ignore Canadian SIN test patterns
  - id: ignore-test-sin
    description: "Ignore fake Canadian SIN in test fixtures"
    pattern: '111[ -]?111[ -]?111'
    paths:
      - code_scanner/tests/test_rules_pii.py

  # Ignore US SSN test patterns
  - id: ignore-test-ssn
    description: "Ignore fake US SSN in test fixtures"
    pattern: '111-11-1111'
    paths:
      - code_scanner/tests/test_rules_pii.py